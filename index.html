<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEREWOLF</title><style>*{box-sizing:border-box}body{background:#141319;color:#eee;font:16px system-ui;margin:0;padding:16px 16px 100px}main{max-width:900px;margin:auto}h1,h2{font-family:serif;color:#c7ab76}h1{letter-spacing:.13em;margin-bottom:0}#people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}article{background:#24212a;padding:8px;text-align:center;border:1px solid #66563d;border-radius:8px}img{width:64px;height:64px;object-fit:cover;border-radius:50%}.out img{filter:grayscale(1);opacity:.55}.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #66563d}.line img{width:44px;height:44px}.line p{margin:4px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#24212a;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}button,select{font:inherit;background:#302b34;color:#f0d5a0;border:1px solid #c7ab76;border-radius:6px;padding:10px}button:disabled{opacity:.4}small{color:#bcb4aa}@media(min-width:700px){#people{grid-template-columns:repeat(9,1fr)}} textarea{width:100%;min-height:120px;background:#24212a;color:#eee;border:1px solid #66563d;font:16px system-ui}#bridge{border:1px solid #c7ab76;padding:12px;margin:12px 0}#bridge[hidden]{display:none}body{background:linear-gradient(#141319e8,#141319f5),url(day.svg) center/cover fixed}body[data-phase=night]{background:linear-gradient(#0b1323c9,#0b1323f5),url(night.svg) center/cover fixed}#titleScreen{background:linear-gradient(transparent,#141319),url(night.svg) center/cover;padding:90px 20px 24px;text-align:center;border:1px solid #66563d}#titleScreen button{display:block;width:min(100%,300px);margin:8px auto}details{margin:12px 0;padding:10px;border:1px solid #66563d}label{display:inline-block;margin:5px}input{max-width:100%;font:inherit}#editor input:not([type=file]){width:100%;background:#24212a;color:white;border:1px solid #66563d;padding:6px}#rosterList article{display:inline-block;margin:4px;min-width:110px}#rosterList.list article{display:block;text-align:left}.flash{animation:fade .6s}@keyframes fade{from{opacity:.15}to{opacity:1}}.line{animation:fade .25s} @media(prefers-reduced-motion:reduce){*{animation:none!important}}pre{overflow-wrap:anywhere} </style><main><section id="titleScreen"><h1>WEREWOLF</h1><p>閉ざされた洋館</p><button id="enter">ゲーム画面へ</button><button id="openRoster">人物図鑑</button><button id="openSettings">環境設定</button></section><h1>WEREWOLF</h1><p>閉ざされた洋館 · Ver.0.4</p><small>観戦専用・APIなし</small><h2 id="phase">開始待ち</h2><section id="people"></section><p><label>進行方式 <select id="mode"><option>発言ごと</option><option>フェーズごと</option></select></label></p><p><label>AI方式 <select id="ai"><option value="local">簡易AI</option><option value="chat">ChatGPT手動連携</option></select></label></p><section id="bridge" hidden><h2>ChatGPT連携</h2><p>公開情報だけをコピーし、ChatGPTへ送信してください。回答のJSONを貼り付けます。</p><textarea id="prompt" readonly></textarea><button id="copy">指示文をコピー</button><textarea id="answer" placeholder="回答JSONを貼り付け"></textarea><button id="apply">回答を取り込む</button> <button id="skip">簡易AIの原文を使う</button><p id="status" role="status"></p></section><details id="preferences"><summary>環境設定</summary><label>文字サイズ <select id="fontSize"><option>中</option><option>小</option><option>大</option></select></label> <label><input type="checkbox" id="sound">BGM・効果音</label> <label><input type="checkbox" id="typing">文字送り</label> <label><input type="checkbox" id="revealVotes">順次開票</label><label>記憶 <select id="memoryMode"><option value="reset">リセット</option><option value="carry">過去の公開経験を引き継ぐ</option></select></label><label>初期関係 <select id="relationship"><option value="neutral">初対面</option><option value="friendly">友好的</option><option value="wary">警戒</option></select></label></details><details id="roster"><summary>人物図鑑・編集</summary><button id="addChar">新規追加</button><label>表示 <select id="rosterMode"><option>カード</option><option>一覧</option></select></label><div id="rosterList"></div><section id="editor" hidden></section></details><button id="resultImage" hidden>結果画像を保存</button><details><summary>保存・履歴・戦績</summary><p id="saveStatus" role="status"></p><button id="saveNow">保存</button> <button id="export">バックアップ出力</button> <label>復元 <input type="file" id="import" accept=".json,application/json"></label><p>バックアップには秘密情報も含まれます。ゲーム中は内容を開かないでください。</p><div id="records"></div><div id="archives"></div></details><section id="log" aria-live="polite"></section></main><footer><button id="new">NEW GAME</button><button id="next" disabled>次へ</button></footer><script src="characters.js"></script><script src="engine.js"></script><script src="bridge.js"></script><script src="storage.js"></script><script src="extra.js"></script><script>
let g,queue=[],waiting=null,archives=[],gameId=null,display=[],ready=false,restoring=false;const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let ps=g?g.players:CHARACTERS;$('people').innerHTML=ps.map(p=>`<article class="${p.alive===false?'out':''}"><img src="${p.image}" alt=""><br>${esc(p.name)}<br><small>${p.alive===false?'OUT':g?'ALIVE':'待機'}</small></article>`).join('');document.body.dataset.phase=g?.phase==='夜'?'night':'day';$('resultImage').hidden=!g?.winner||!!queue.length;$('phase').textContent=g?`DAY ${g.day} — ${queue.length?'昼':g.phase}`:'開始待ち';$('next').disabled=!g||!!waiting||!!g.winner&&!queue.length;if(ready&&!restoring)persist();}function add(t){if(!restoring)display.push({text:t});let d=document.createElement('p');d.textContent=t;$('log').append(d)}function say(m){if(!restoring)display.push({message:m});let p=g.get(m.speaker),d=document.createElement('div');d.className='line';d.innerHTML=`<img src="${p.image}" alt=""><div><strong>${esc(p.name)}</strong><p>${esc(m.text)}</p></div>`;$('log').append(d);if(!restoring&&$('typing').checked){let el=d.querySelector('p'),txt=el.textContent;el.textContent='';let i=0;let t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(t)},18);d.onclick=()=>{clearInterval(t);el.textContent=txt}}}$('new').onclick=()=>{if(g&&!g.winner&&!confirm('現在のゲームを破棄しますか？'))return;if(CHARACTERS.length!==9){alert("登録人数を9人にしてください");return;}g=new WerewolfGame(CHARACTERS);initializeGame(g);gameId=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();display=[];queue=[];waiting=null;$('bridge').hidden=true;$('log').replaceChildren();render()};$('next').onclick=()=>{if(!queue.length){let r=g.step();if(r.messages){if($('ai').value==='chat'){waiting=r.messages;$('bridge').hidden=false;$('answer').value='';$('status').textContent='';$('prompt').value='架空の人狼ゲームの公開会話を自然な日本語に整えてください。各発言の意味・対象・主張を変えず、locked が true の発言は原文のままにしてください。新しい情報を作らないでください。出力は lines と同じ順序・件数の JSON 配列（index, speaker, text）のみ。\n'+WolfBridge.request(g,waiting);render();return;}queue=r.messages;}if(r.counts)r.counts.forEach((c,i)=>{if($('revealVotes').checked){let k=0;for(let [id,n] of Object.entries(c))for(let j=0;j<n;j++)add(`開票 ${++k}：${g.get(id).name}`)}add(`投票 ${i+1}回目：`+Object.entries(c).map(([id,n])=>g.get(id).name+' '+n+'票').join('／'))});if(r.exile){effect();say(r.message);add(g.get(r.exile).name+' 追放')}if(r.out){effect();}if(r.out)add(r.out.length?r.out.map(id=>g.get(id).name).join('、')+' 脱落':'脱落者なし');}if(queue.length){let n=$('mode').value==='発言ごと'?1:queue.length;queue.splice(0,n).forEach(say)}if(g.winner&&!queue.length){add(g.winner+'陣営 WIN ／ MVP '+g.get(g.mvp).name);g.players.forEach(p=>add(p.name+'：'+p.role+'／'+(p.alive?'生存':'脱落')));let d=document.createElement('details');d.innerHTML='<summary>全投票・夜行動・個別記憶（開発ログ）</summary>';let pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify({history:g.history,players:g.players.map(p=>({name:p.name,memory:p.memory,relations:p.relations}))},null,2);d.append(pre);$('log').append(d);archiveGame()}render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('status').textContent='コピーしました';}catch(e){$('prompt').focus();$('prompt').select();$('status').textContent='選択した文章を手動でコピーしてください';}};function finishBridge(lines){let start=g.log.length-waiting.length;for(let i=0;i<lines.length;i++){let old=waiting[i];g.log[start+i].text=lines[i].text;for(let p of g.players)for(let m of p.memory)if(m.type==='発言'&&m.day===old.day&&m.speaker===old.speaker&&m.text===old.text)m.text=lines[i].text;}queue=lines;waiting=null;$('bridge').hidden=true;render();} $('apply').onclick=()=>{if(!waiting)return;try{finishBridge(WolfBridge.validate($('answer').value,waiting));}catch(e){$('status').textContent=e.message;}};$('skip').onclick=()=>{if(waiting)finishBridge(waiting);};
function state(){return {version:3,characters:CHARACTERS,game:WolfStore.snapshot(g),gameId,queue,waiting,display,history:archives,settings:{mode:$('mode').value,ai:$('ai').value,answer:$('answer').value,prompt:$('prompt').value,ui:uiSettings()}}}
let saveChain=Promise.resolve();function persist(){let s=JSON.parse(JSON.stringify(state()));saveChain=saveChain.catch(()=>{}).then(()=>WolfStore.write(s)).then(()=>{$('saveStatus').textContent='端末に保存済み '+new Date().toLocaleTimeString()}).catch(e=>{$('saveStatus').textContent='保存失敗：バックアップを出力してください '+e.message});return saveChain}
function archiveGame(){if(g?.winner&&!archives.some(h=>h.id===gameId)){archives.push({id:gameId,date:new Date().toISOString(),game:WolfStore.snapshot(g),display:JSON.parse(JSON.stringify(display))});records()}}
function records(){$('records').replaceChildren();for(let r of WolfStore.stats(archives,CHARACTERS)){let d=document.createElement('details');let h=document.createElement('summary');h.textContent=`${r.name} ${r.games}戦 ${r.wins}勝 MVP ${r.mvp} / 勝率 ${r.games?Math.round(r.wins/r.games*100)+'%':'—'}`;let p=document.createElement('p');p.textContent='陣営に沿った投票 '+r.correct+'/'+r.votes+'（最終投票）／'+Object.entries(r.roles).map(([k,v])=>k+' '+v.wins+'/'+v.games).join('、');d.append(h,p);$('records').append(d)}$('archives').replaceChildren();for(let h of archives){let d=document.createElement('details'),t=document.createElement('summary'),p=document.createElement('pre');t.textContent=h.date+' '+h.game.winner+'陣営 WIN';p.style.whiteSpace='pre-wrap';p.textContent=JSON.stringify(h.game,null,2);d.append(t,p);$('archives').append(d)}}
function load(s){WolfStore.validate(s);restoring=true;g=WolfStore.restore(s.game);gameId=s.gameId;queue=s.queue;waiting=s.waiting;display=s.display;archives=s.history;window.CHARACTERS=s.characters;restoreUI(s.settings.ui);rosterRender();$('mode').value=s.settings.mode;$('ai').value=s.settings.ai;$('answer').value=s.settings.answer||'';$('prompt').value=s.settings.prompt||'';$('bridge').hidden=!waiting;$('log').replaceChildren();for(let d of display)d.message?say(d.message):add(d.text);if(g?.winner){let d=document.createElement('details'),h=document.createElement('summary'),p=document.createElement('pre');h.textContent='全記録';p.style.whiteSpace='pre-wrap';p.textContent=JSON.stringify(WolfStore.snapshot(g),null,2);d.append(h,p);$('log').append(d)}records();render();restoring=false}
$('saveNow').onclick=persist;for(let id of ['mode','ai','answer'])$(id).addEventListener('change',()=>{if(ready)persist()});$('export').onclick=async()=>{try{let s=state();s.images={};for(let c of s.characters){let response=await fetch(c.image);if(!response.ok)throw Error('画像取得失敗');let blob=await response.blob();s.images[c.id]=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}let url=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='werewolf-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){$('saveStatus').textContent='出力失敗：'+e.message}};$('import').onchange=async()=>{try{let s=WolfStore.validate(JSON.parse(await $('import').files[0].text()));if(!confirm('現在の保存データを置き換えますか？'))return;for(let c of s.characters){let image=s.images?.[c.id];if(typeof image!=='string'||!/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(image))throw Error('画像が不正です');c.image=image}for(let game of [s.game,...s.history.map(h=>h.game)].filter(Boolean))for(let p of game.players)p.image=s.characters.find(c=>c.id===p.id)?.image||p.image;load(s);await persist()}catch(e){$('saveStatus').textContent='復元失敗：'+e.message}finally{$('import').value=''}};
setupExtra();$('new').disabled=true;render();WolfStore.read().then(s=>{if(s)load(s)}).catch(e=>{$('saveStatus').textContent='保存データ読み込み失敗：'+e.message}).finally(()=>{ready=true;$('new').disabled=false;records();render()});</script></html>
